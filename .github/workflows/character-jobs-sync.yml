name: Character Blender Jobs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/heroes.json
      - data/enemies.json
      - data/levels/ashlands_minibosses.json
      - tools/blender/generate_character_jobs.py
      - .github/workflows/character-jobs-sync.yml

concurrency:
  group: character-jobs-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Regenerate deterministic character jobs
        run: python tools/blender/generate_character_jobs.py

      - name: Validate generated character jobs
        run: python -m pytest -q tests/python/test_character_blender_automation.py

      - name: Verify synchronized generated data
        shell: bash
        run: |
          if git diff --quiet -- data/blender/character_jobs.json; then
            echo "character_jobs.json already synchronized"
            exit 0
          fi
          echo "::error file=data/blender/character_jobs.json::Generated character jobs are out of sync. Regenerate and commit the file through a pull request."
          git --no-pager diff -- data/blender/character_jobs.json
          exit 1
