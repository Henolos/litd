name: Governance Domain Isolation

on:
  pull_request:
    paths:
      - 'docs/governance/GLOBAL_GOVERNANCE_DOMAIN_ISOLATION.md'
      - 'tools/quality/governance_domain_isolation.py'
      - 'tests/python/test_governance_domain_isolation.py'
      - '.github/workflows/governance-domain-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run domain isolation tests
        run: python -m pytest -q tests/python/test_governance_domain_isolation.py
      - name: Verify fail-closed isolation boundaries
        run: |
          grep -q 'cross-domain change requires SENSITIVE minimum' tools/quality/governance_domain_isolation.py
          grep -q 'sensitive data boundary requires CRITICAL' tools/quality/governance_domain_isolation.py
          grep -q 'secret values are forbidden in Change Records' tools/quality/governance_domain_isolation.py
          grep -q 'isolation verification must pass' tools/quality/governance_domain_isolation.py
          grep -q 'domain-specific rollback impact required' tools/quality/governance_domain_isolation.py
