name: PostgreSQL Receipt Registry Live Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install live proof dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Require governance database secret
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          test -n "$GOVERNANCE_DATABASE_URL" || {
            echo 'GOVERNANCE_DATABASE_URL secret is required' >&2
            exit 2
          }
      - name: Run durable replay protection proof
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: python tools/quality/run_postgres_receipt_registry_live_proof.py
      - name: Upload retained governance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: postgres-receipt-registry-live-proof
          path: reports/postgres-receipt-registry-live-proof.json
          if-no-files-found: error
          retention-days: 30
