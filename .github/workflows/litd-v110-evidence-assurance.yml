name: LITD V1.10 evidence assurance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/litd-v110-evidence-assurance.yml'
      - 'docs/qa/v110_evidence_assurance.py'
      - 'docs/qa/ARCH12_SCENARIO_ORACLES_AND_V110_REVIEW_2026-11-26.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  tree:
    name: C01 Git tree identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/qa/v110_evidence_assurance.py --control tree
  hashes:
    name: C02 Manifest SHA-256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/qa/v110_evidence_assurance.py --control hashes
  metadata:
    name: C03 Actions run metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/qa/v110_evidence_assurance.py --control metadata
  logs:
    name: C04 Actions job logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/qa/v110_evidence_assurance.py --control logs
