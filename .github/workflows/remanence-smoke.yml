name: Remanence Smoke

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: remanence-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  remanence-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify preserved Remanence lore and reference integrity after gameplay removal
        run: python3 tools/qa/reconstruction_audit.py --group lore
