name: Godot Live Status

on:
  workflow_run:
    workflows: ["CI"]
    types: [requested, completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: godot-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  mirror-canonical-ci:
    name: Mirror canonical Godot CI status
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical CI status without rerunning Godot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ACTION: ${{ github.event.action }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          action = os.environ["RUN_ACTION"]
          conclusion = os.environ.get("RUN_CONCLUSION", "")
          if action in {"requested", "in_progress"}:
              state = "pending"
              description = "Godot CI canonique en cours"
          elif conclusion == "success":
              state = "success"
              description = "Godot CI canonique validée"
          elif conclusion in {"failure", "timed_out"}:
              state = "failure"
              description = f"Godot CI canonique: {conclusion}"
          else:
              state = "error"
              description = f"Godot CI canonique: {conclusion or action}"

          payload = json.dumps({
              "state": state,
              "target_url": os.environ["TARGET_URL"],
              "description": description[:140],
              "context": "godot-progress",
          }).encode("utf-8")
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/statuses/{os.environ['TARGET_SHA']}"
          )
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          print(f"GODOT_STATUS_MIRROR state={state} sha={os.environ['TARGET_SHA']}")
          PY
