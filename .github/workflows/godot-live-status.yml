name: Godot Live Status

on:
  workflow_run:
    workflows: ["CI"]
    types: [requested, completed]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: godot-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  mirror-canonical-ci:
    name: Mirror canonical Godot CI status
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical CI status without rerunning Godot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          # Events can wait behind another mirror job. Read the current attempt
          # so a late requested/completed event cannot publish stale state.
          run_id = int(os.environ["RUN_ID"])
          current_request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(current_request, timeout=30) as response:
              current = json.load(response)
          if current.get("id") != run_id or current.get("head_sha") != os.environ["TARGET_SHA"]:
              raise SystemExit("canonical CI run identity mismatch")
          run_status = current.get("status", "")
          conclusion = current.get("conclusion") or ""
          if run_status in {"queued", "in_progress", "waiting", "pending", "requested"}:
              state = "pending"
              description = "Godot CI canonique en cours"
          elif run_status == "completed" and conclusion == "success":
              state = "success"
              description = "Godot CI canonique validée"
          elif run_status == "completed" and conclusion in {"failure", "timed_out"}:
              state = "failure"
              description = f"Godot CI canonique: {conclusion}"
          else:
              state = "error"
              description = f"Godot CI canonique: {conclusion or run_status}"

          payload = json.dumps({
              "state": state,
              "target_url": os.environ["TARGET_URL"],
              "description": description[:140],
              "context": "godot-progress",
          }).encode("utf-8")
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/statuses/{os.environ['TARGET_SHA']}"
          )
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          print(f"GODOT_STATUS_MIRROR state={state} sha={os.environ['TARGET_SHA']}")
          PY
