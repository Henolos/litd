name: Godot Live Status

on:
  push:
    branches: [main, develop]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'addons/**'
      - 'assets/**'
      - 'data/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/ci/godot_progress_bridge.py'
      - '.github/workflows/godot-live-status.yml'
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'addons/**'
      - 'assets/**'
      - 'data/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/ci/godot_progress_bridge.py'
      - '.github/workflows/godot-live-status.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: godot-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-godot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Installer Python pour le pont de progression
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates
      - name: Publier la progression Godot en direct
        env:
          GODOT_PROGRESS_TOKEN: ${{ github.token }}
          GODOT_PROGRESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GODOT_PROGRESS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci/godot_progress_bridge.py
