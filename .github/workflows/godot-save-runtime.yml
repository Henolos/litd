name: Godot save runtime tests

on:
  pull_request:
    paths:
      - 'scripts/core/save_manager.gd'
      - 'tests/godot/**'
      - 'tools/ci/run_godot_checked.sh'
      - '.github/workflows/godot-save-runtime.yml'
      - 'project.godot'
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  save-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run isolated save integrity tests
        shell: bash
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          export XDG_DATA_HOME="$sandbox"
          export LITD_SAVE_TEST_SANDBOX="$sandbox"
          bash tools/ci/run_godot_checked.sh --log "$sandbox/import.log" -- godot --headless --path . --import --quit
          bash tools/ci/run_godot_checked.sh --log "$sandbox/runtime.log" --expect SAVE_RUNTIME_CONTRACT_PASS -- godot --headless --path . --script res://tests/godot/test_save_runtime_headless.gd
          bash tools/ci/run_godot_checked.sh --log "$sandbox/roundtrip.log" --expect SAVE_ROUNDTRIP_CONTRACT_PASS -- godot --headless --path . --script res://tests/godot/test_save_roundtrip_headless.gd
