name: Systemic Animation v44

on:
  push:
    branches: [main, develop]
    paths:
      - 'data/blender/systemic_animation_v44.json'
      - 'data/blender/anatomical_pipeline_v43.json'
      - 'data/body_visual_runtime_v42.json'
      - 'data/blender/character_jobs.json'
      - 'tools/blender/generate_systemic_animation_v44.py'
      - 'tools/blender/systemic_animation_v44.py'
      - 'tools/blender/generate_anatomical_pipeline_v43.py'
      - 'tools/qa/systemic_animation_v44_audit.py'
      - 'scripts/visual/systemic_body_animation_runtime.gd'
      - 'scripts/visual/body_state_visual_adapter.gd'
      - 'scripts/core/body_animation_v44_smoke_test.gd'
      - 'scenes/tests/body_animation_v44_smoke.tscn'
      - '.github/workflows/systemic-animation-v44.yml'
  pull_request:
    paths:
      - 'data/blender/systemic_animation_v44.json'
      - 'data/blender/anatomical_pipeline_v43.json'
      - 'data/body_visual_runtime_v42.json'
      - 'data/blender/character_jobs.json'
      - 'tools/blender/generate_systemic_animation_v44.py'
      - 'tools/blender/systemic_animation_v44.py'
      - 'tools/blender/generate_anatomical_pipeline_v43.py'
      - 'tools/qa/systemic_animation_v44_audit.py'
      - 'scripts/visual/systemic_body_animation_runtime.gd'
      - 'scripts/visual/body_state_visual_adapter.gd'
      - 'scripts/core/body_animation_v44_smoke_test.gd'
      - 'scenes/tests/body_animation_v44_smoke.tscn'
      - '.github/workflows/systemic-animation-v44.yml'
  workflow_dispatch:

concurrency:
  group: systemic-animation-v44-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  animation-v44-static:
    if: ${{ github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compiler les scripts v44
        run: python -m py_compile tools/blender/generate_systemic_animation_v44.py tools/blender/systemic_animation_v44.py tools/qa/systemic_animation_v44_audit.py
      - name: Auditer le pipeline d'animation v44
        run: python -m tools.qa.systemic_animation_v44_audit
      - name: Générer le plan complet d'animation du casting
        run: python -m tools.blender.generate_systemic_animation_v44 --output systemic_animation_jobs_v44.json
      - name: Vérifier le plan d'un Veilleur sans Blender
        run: python -m tools.blender.systemic_animation_v44 --job-id aurelien --print-plan > v44_aurelien_plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: systemic-animation-v44-jobs
          path: |
            systemic_animation_jobs_v44.json
            v44_aurelien_plan.json

  animation-v44-godot:
    if: ${{ github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Importer le projet
        run: godot --headless --path . --import --quit
      - name: Tester le runtime corporel v44
        run: godot --headless --path . res://scenes/tests/body_animation_v44_smoke.tscn
