name: Application Closure Contract

on:
  pull_request:
    paths:
      - 'tools/quality/application_closure_contract.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_application_closure_contract.py'
      - '.github/workflows/application-closure-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run application closure contract tests
        run: python -m pytest -q tests/python/test_application_closure_contract.py
      - name: Verify closure canonical authority and evidence protections
        run: |
          grep -q 'APPLIED_MEASURED_PROVENANCE_VERIFIED' tools/quality/application_closure_contract.py
          grep -q 'assert_authority_equivalent' tools/quality/application_closure_contract.py
          grep -q 'CANONICAL_AUTHORITY' tools/quality/application_closure_contract.py
          grep -q 'automatic_rollback_allowed' tools/quality/guardian_authority_contract.py
          grep -q 'checkpoint_transparency_log_verified' tools/quality/application_closure_contract.py
          grep -q 'rollback_review_required' tools/quality/application_closure_contract.py
