name: GitHub Actions Pinning Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/qa/github_actions_pinning_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinning-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify repository workflows use immutable SHAs
        run: python tools/qa/github_actions_pinning_audit.py --all
