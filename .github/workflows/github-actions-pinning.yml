name: GitHub Actions Pinning Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/qa/github_actions_pinning_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinning-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify repository workflows use immutable SHAs
        run: python tools/qa/github_actions_pinning_audit.py --all
