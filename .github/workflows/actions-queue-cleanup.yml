name: Actions Queue Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-targeted-run-recovery-20261112
  cancel-in-progress: false

jobs:
  targeted-recovery:
    if: github.repository == 'Henolos/litd' && github.ref == 'refs/heads/maintenance/targeted-run-recovery-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover only the two verified empty queued runs
        shell: bash
        run: |
          python3 - <<'PYRECOVERY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = 'Henolos/litd'
          TARGETS = {43095219494: 7, 43095233129: 8}
          REPLACEMENT = 43216305002
          WORKFLOW_ID = 411793470
          OLD_SHA = '14f214278b26628e8e9b6d8bdc5b79227d169d02'
          API = f'https://api.github.com/repos/{REPO}'

          def request(path, method='GET'):
              headers = {'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                         'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2022-11-28'}
              req = urllib.request.Request(API + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  payload = json.loads(raw) if raw else {}
                  if exc.code not in (409, 422, 500):
                      raise RuntimeError(f'GitHub HTTP {exc.code}: {payload.get("message", "request failed")}') from None
                  return exc.code, payload

          def read_run(run_id):
              code, run = request(f'/actions/runs/{run_id}')
              if code != 200:
                  raise RuntimeError(f'Cannot verify run {run_id}: HTTP {code}')
              return run

          def verify_target(run, jobs):
              return (run.get('id') in TARGETS
                      and run.get('run_number') == TARGETS[run['id']]
                      and run.get('workflow_id') == WORKFLOW_ID
                      and run.get('head_branch') == 'main'
                      and run.get('head_sha') == OLD_SHA
                      and run.get('event') == 'workflow_dispatch'
                      and run.get('status') == 'queued'
                      and run.get('conclusion') is None
                      and jobs.get('total_count') == 0
                      and jobs.get('jobs') == [])

          def guarded_target(run_id):
              run = read_run(run_id)
              if run.get('status') == 'completed':
                  return run, False
              code, jobs = request(f'/actions/runs/{run_id}/jobs?per_page=100')
              if code != 200 or not verify_target(run, jobs):
                  raise RuntimeError(f'Refusing cancellation: target {run_id} changed or has jobs')
              return run, True

          def wait_for_terminal(run_id):
              for attempt in range(10):
                  run = read_run(run_id)
                  if run.get('status') == 'completed':
                      return run
                  time.sleep(2)
              return read_run(run_id)

          def recover(run_id):
              run, eligible = guarded_target(run_id)
              if not eligible:
                  return {'id': run_id, 'status': run['status'], 'conclusion': run.get('conclusion'), 'attempts': []}
              attempts = []
              for endpoint in ('cancel', 'force-cancel'):
                  # Recheck identity and absence of jobs immediately before each mutation.
                  run, eligible = guarded_target(run_id)
                  if not eligible:
                      break
                  code, payload = request(f'/actions/runs/{run_id}/{endpoint}', method='POST')
                  result = {'operation': endpoint, 'http': code, 'message': payload.get('message')}
                  attempts.append(result)
                  print(json.dumps({'id': run_id, **result}), flush=True)
                  run = wait_for_terminal(run_id) if code == 202 else read_run(run_id)
                  if run.get('status') == 'completed':
                      break
                  if code not in (202, 409, 422, 500):
                      raise RuntimeError(f'Unexpected cancellation response {code}')
              return {'id': run_id, 'status': run.get('status'), 'conclusion': run.get('conclusion'), 'attempts': attempts}

          def main():
              if os.environ.get('GITHUB_REPOSITORY') != REPO:
                  raise RuntimeError('Wrong repository')
              if os.environ.get('GITHUB_REF') != 'refs/heads/maintenance/targeted-run-recovery-20261112':
                  raise RuntimeError('Wrong maintenance branch')
              replacement = read_run(REPLACEMENT)
              if not (replacement.get('workflow_id') == WORKFLOW_ID
                      and replacement.get('head_branch') == 'main'
                      and replacement.get('status') == 'completed'
                      and replacement.get('conclusion') == 'success'):
                  raise RuntimeError('Successful replacement unavailable; refusing cancellation')
              outcomes = [recover(run_id) for run_id in TARGETS]
              print(json.dumps({'outcomes': outcomes}, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Targeted Actions recovery\n\n')
                  for result in outcomes:
                      summary.write(f'- Run {TARGETS[result["id"]]} ({result["id"]}): {result["status"]} / {result["conclusion"]}\n')
                  summary.write('\nNo run history deleted. No other runs targeted.\n')
              return 0 if all(r['status'] == 'completed' for r in outcomes) else 1

          if __name__ == '__main__':
              raise SystemExit(main())
          PYRECOVERY
