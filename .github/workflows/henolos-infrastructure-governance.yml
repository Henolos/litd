name: HENOLOS Infrastructure Governance Binding
on:
  pull_request:
    paths:
      - 'docs/governance/HENOLOS_INFRASTRUCTURE_GOVERNANCE_BINDING.md'
      - 'tools/quality/henolos_infrastructure_governance.py'
      - 'tests/python/test_henolos_infrastructure_governance.py'
      - '.github/workflows/henolos-infrastructure-governance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify HENOLOS Infrastructure binding
        run: python -m pytest -q tests/python/test_henolos_infrastructure_governance.py
