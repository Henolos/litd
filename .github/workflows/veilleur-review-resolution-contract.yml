name: Veilleur Review Resolution Contract

on:
  pull_request:
    paths:
      - 'tools/quality/veilleur_review_resolution.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_veilleur_review_resolution.py'
      - '.github/workflows/veilleur-review-resolution-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify governed resolution contract
        run: python -m pytest -q tests/python/test_veilleur_review_resolution.py
      - name: Assert canonical authority binding
        run: |
          python - <<'PY'
          from tools.quality.guardian_authority_contract import CANONICAL_AUTHORITY
          from tools.quality.veilleur_review_resolution import (
              VEILLEUR_CANONICAL_AUTHORITY,
              resolve_candidate,
              _hash,
          )

          payload = {
              "kind": "LITD_LIBRARY_REVIEW_CANDIDATE",
              "project_id": "LITD",
              "target_route": "LITD_LIBRARY",
              "evidence_id": "ci",
              "route": "LITD_LIBRARY",
              "cross_reference": False,
              "core_write_allowed": False,
              "automatic_library_write_allowed": False,
          }
          payload["candidate_hash"] = _hash(payload)
          resolution = {
              "candidate_hash": payload["candidate_hash"],
              "decision": "PROPOSE_LITD_CHANGE_CANDIDATE",
              "rationale": "CI verifies canonical Guardian authority binding.",
              "decided_by": "ci-contract",
              "decided_at": "2026-09-18T00:00:00+00:00",
              "evidence_refs": ["ci:veilleur-review-resolution"],
          }
          receipt = resolve_candidate(payload, resolution)
          for key in VEILLEUR_CANONICAL_AUTHORITY:
              if receipt.get(key) is not CANONICAL_AUTHORITY[key]:
                  raise SystemExit(f"Veilleur authority mismatch: {key}")
          for key in ("library_write_allowed", "automatic_obsolescence_allowed"):
              if receipt.get(key) is not False:
                  raise SystemExit(f"Veilleur-specific authority violation: {key}")
          if receipt["outcome"] != "LITD_CHANGE_CANDIDATE_APPROVED_PENDING_GUARDIAN":
              raise SystemExit("Guardian review boundary was not preserved")
          PY
