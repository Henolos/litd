name: PostgreSQL Receipt Registry

on:
  pull_request:
    paths:
      - 'tools/quality/postgres_receipt_consumption_registry.py'
      - 'tools/quality/receipt_registry_factory.py'
      - 'supabase/migrations/**'
      - 'tests/fixtures/postgres_supabase_roles.sql'
      - 'tests/python/test_postgres_receipt_consumption_registry.py'
      - '.github/workflows/postgres-receipt-registry.yml'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-registry:
    name: PostgreSQL Registry
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      LITD_GOVERNANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply registry migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/fixtures/postgres_supabase_roles.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260912162000_governance_receipt_registry.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260913093000_governance_receipt_registry_runtime.sql
      - name: Prove atomic replay protection on PostgreSQL
        run: python -m pytest -q tests/python/test_postgres_receipt_consumption_registry.py
