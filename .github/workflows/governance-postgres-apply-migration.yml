name: Governance PostgreSQL Apply Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_GOVERNANCE_MIGRATION_20260915064500"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-postgres-schema-migration
  cancel-in-progress: false

jobs:
  apply-migration:
    name: Apply governance audit-chain migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-live-cert
    steps:
      - name: Require explicit migration confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_GOVERNANCE_MIGRATION_20260915064500" || {
            echo "Explicit migration confirmation did not match. Failing closed."
            exit 2
          }

      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fail closed when database secret is absent
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_DATABASE_URL" || {
            echo "GOVERNANCE_DATABASE_URL is not configured for governance-live-cert"
            exit 2
          }

      - name: Apply exact governed migration transactionally
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260915064500_governance_audit_chain_verification.sql"
          test -f "$migration"
          sha256sum "$migration" | tee /tmp/governance-migration.sha256
          psql "$GOVERNANCE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file="$migration"

      - name: Verify proof RPCs exist after migration
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          verify_chain="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select to_regprocedure('governance_private.verify_consumption_audit_chain()') is not null")"
          verify_guards="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select to_regprocedure('governance_private.probe_append_only_guards(text,text,text,text)') is not null")"
          test "$verify_chain" = "t"
          test "$verify_guards" = "t"
          migration_sha="$(cut -d' ' -f1 /tmp/governance-migration.sha256)"
          printf '{"migration":"20260915064500_governance_audit_chain_verification.sql","migration_sha256":"%s","git_sha":"%s","verify_consumption_audit_chain":true,"probe_append_only_guards":true}\n' \
            "$migration_sha" "$GITHUB_SHA" > governance-postgres-migration-evidence.json

      - name: Upload migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-postgres-migration-${{ github.sha }}
          path: governance-postgres-migration-evidence.json
          if-no-files-found: error
          retention-days: 90
