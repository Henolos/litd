name: Bounded Implementation Contract

on:
  pull_request:
    paths:
      - 'tools/quality/bounded_implementation_contract.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_bounded_implementation_contract.py'
      - '.github/workflows/bounded-implementation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run bounded implementation contract tests
        run: python -m pytest -q tests/python/test_bounded_implementation_contract.py
      - name: Verify canonical authority binding
        run: |
          grep -q 'READY_FOR_APPLICATION_REVIEW' tools/quality/bounded_implementation_contract.py
          grep -q 'assert_authority_equivalent' tools/quality/bounded_implementation_contract.py
          grep -q 'CANONICAL_AUTHORITY' tools/quality/bounded_implementation_contract.py
