name: Governance Recovery Live Certification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_GOVERNANCE_RECOVERY_CERT_20260916061000"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-recovery-live-certification
  cancel-in-progress: false

jobs:
  live-certification:
    name: Recovery Live Certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-live-cert
    steps:
      - name: Require explicit certification confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN_GOVERNANCE_RECOVERY_CERT_20260916061000" || {
            echo "Explicit recovery certification confirmation did not match. Failing closed." >&2
            exit 2
          }

      - name: Checkout exact dispatched revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fail closed when live database secret is absent
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_DATABASE_URL" || {
            echo "GOVERNANCE_DATABASE_URL is not configured for governance-live-cert" >&2
            exit 2
          }

      - name: Install PostgreSQL client dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run bounded live rollback and recovery certification
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: python -m tools.quality.postgres_recovery_live_cert

      - name: Upload recovery certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-recovery-live-certification-${{ github.sha }}
          path: artifacts/governance/postgres-recovery-live-certification.json
          if-no-files-found: error
          retention-days: 90
