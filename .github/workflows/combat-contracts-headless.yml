name: Combat contracts headless

on:
  pull_request:
    paths:
      - 'scripts/core/combat/**'
      - 'scripts/core/combat_position_runtime.gd'
      - 'scripts/core/veilleurs_body_component.gd'
      - 'scripts/tests/combat_ranks_body_status_contract.gd'
      - 'scenes/tests/combat_ranks_body_status_contract.tscn'
      - '.github/workflows/combat-contracts-headless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-contracts:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Import project
        run: timeout 120s godot --headless --path . --import --quit
      - name: Rank, body and affliction contracts
        run: timeout 60s godot --headless --path . res://scenes/tests/combat_ranks_body_status_contract.tscn
