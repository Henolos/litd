name: Guardian Change Gate Contract

on:
  pull_request:
    paths:
      - 'tools/quality/guardian_change_gate.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_guardian_change_gate.py'
      - 'tests/python/test_guardian_authority_contract.py'
      - '.github/workflows/guardian-change-gate-contract.yml'
      - 'tools/quality/veilleur_review_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-change-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Guardian change gate and authority-equivalence tests
        run: python -m pytest -q tests/python/test_guardian_change_gate.py tests/python/test_guardian_authority_contract.py tests/python/test_veilleur_review_resolution.py
      - name: Assert hard Guardian boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/quality/guardian_change_gate.py').read_text(encoding='utf-8')
          assert 'READY_FOR_BOUNDED_IMPLEMENTATION_PR' in text
          for invariant in ('core_write_allowed','automatic_code_write_allowed','automatic_merge_allowed','automatic_target_change_allowed'):
              assert f'CANONICAL_AUTHORITY["{invariant}"]' in text, invariant
          for invariant in ('tests_must_pass_before_application','rollback_evidence_required'):
              assert f'REQUIRED_GUARANTEES["{invariant}"]' in text, invariant
          print('Guardian canonical authority binding OK')
          PY
