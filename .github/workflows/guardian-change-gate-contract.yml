name: Guardian Change Gate Contract

on:
  pull_request:
    paths:
      - 'tools/quality/guardian_change_gate.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_guardian_change_gate.py'
      - 'tests/python/test_guardian_authority_contract.py'
      - '.github/workflows/guardian-change-gate-contract.yml'
      - 'tools/quality/veilleur_review_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-change-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Guardian change gate and authority-equivalence tests
        run: python -m pytest -q tests/python/test_guardian_change_gate.py tests/python/test_guardian_authority_contract.py tests/python/test_veilleur_review_resolution.py
      - name: Assert hard Guardian boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.quality.guardian_authority_contract import CANONICAL_AUTHORITY, REQUIRED_GUARANTEES
          text = Path('tools/quality/guardian_change_gate.py').read_text(encoding='utf-8')
          assert 'READY_FOR_BOUNDED_IMPLEMENTATION_PR' in text
          for invariant, expected in {**CANONICAL_AUTHORITY, **REQUIRED_GUARANTEES}.items():
              literal = f'\"{invariant}\": {expected}'
              assert literal in text, literal
          print('Guardian canonical authority equivalence OK')
          PY
