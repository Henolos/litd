name: HENOLOS Business Governance Binding

on:
  pull_request:
    paths:
      - 'docs/governance/HENOLOS_BUSINESS_GOVERNANCE_BINDING.md'
      - 'tools/quality/henolos_business_governance.py'
      - 'tests/python/test_henolos_business_governance.py'
      - '.github/workflows/henolos-business-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify HENOLOS Business binding
        run: python -m pytest -q tests/python/test_henolos_business_governance.py
