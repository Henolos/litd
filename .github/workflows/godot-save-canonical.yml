name: Godot canonical save state tests

on:
  pull_request:
    paths:
      - 'scripts/core/save_manager.gd'
      - 'tests/godot/test_save_canonical_headless.gd'
      - 'tests/godot/test_save_transaction_preview_headless.gd'
      - '.github/workflows/godot-save-canonical.yml'
      - 'tests/native/save_lock_lab/**'
      - 'tests/python/save_lock_lab.py'
      - 'tests/python/test_save_lock_lab.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run canonical state contract
        shell: bash
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          export XDG_DATA_HOME="$sandbox"
          export LITD_SAVE_TEST_SANDBOX="$sandbox"
          bash tools/ci/run_godot_checked.sh --log "$sandbox/import.log" -- godot --headless --path . --import --quit
          bash tools/ci/run_godot_checked.sh --log "$sandbox/canonical.log" --expect SAVE_CANONICAL_CONTRACT_PASS -- godot --headless --path . --script res://tests/godot/test_save_canonical_headless.gd
          bash tools/ci/run_godot_checked.sh --log "$sandbox/transaction.log" --expect SAVE_TRANSACTION_PREVIEW_PASS -- godot --headless --path . --script res://tests/godot/test_save_transaction_preview_headless.gd
  windows-save-recovery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Godot console build
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/godotengine/godot/releases/tags/4.7.2-stable"
          $asset = $release.assets | Where-Object { $_.name -eq "Godot_v4.7.2-stable_win64.exe.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Official Godot 4.7.2 Windows console asset not found." }
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $expected = "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Godot archive SHA-256 mismatch: $actual" }
          $install = Join-Path $env:RUNNER_TEMP "godot"
          Expand-Archive -Path $zip -DestinationPath $install -Force
          $exe = Get-ChildItem -Path $install -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable was not extracted." }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import and exercise recovery using an isolated Windows profile
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP ("litd-save-sandbox-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          $env:APPDATA = $sandbox
          $env:LOCALAPPDATA = $sandbox
          $env:XDG_DATA_HOME = $sandbox
          $env:LITD_SAVE_TEST_SANDBOX = $sandbox
          & $env:GODOT_EXE --headless --path . --import --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows import failed: $LASTEXITCODE" }
          & $env:GODOT_EXE --headless --path . --script res://tests/godot/test_save_canonical_headless.gd
          if ($LASTEXITCODE -ne 0) { throw "Windows canonical save test failed: $LASTEXITCODE" }
          & $env:GODOT_EXE --headless --path . --script res://tests/godot/test_save_transaction_preview_headless.gd
          if ($LASTEXITCODE -ne 0) { throw "Windows interrupted-write/recovery matrix failed: $LASTEXITCODE" }

  native-lock-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Verify native lock contention and forced termination
        run: python -m pytest -v tests/python/test_save_lock_lab.py

      - name: Compile native lock on Linux
        if: runner.os == 'Linux'
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/native/save_lock_lab/main.cpp -o save-lock-lab
      - name: Compile native lock on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tests\native\save_lock_lab\main.cpp /Fe:save-lock-lab.exe
      - name: Test compiled native lock on Linux
        if: runner.os == 'Linux'
        run: python tests/native/save_lock_lab/check.py ./save-lock-lab
      - name: Test compiled native lock on Windows
        if: runner.os == 'Windows'
        run: python tests/native/save_lock_lab/check.py ./save-lock-lab.exe

      - name: Fetch pinned godot-cpp and compile isolated extension
        shell: bash
        run: |
          set -euo pipefail
          sha=507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$sha"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$sha"
          actual_license=$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD:LICENSE.md)
          echo "Committed license blob: $actual_license"
          test "$actual_license" = eb446fe72ce5c705f70413394200f10f67a123cd
          cmake -S tests/native/save_lock_lab -B "$RUNNER_TEMP/lock-build" -DGODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/lock-build" --config Debug --parallel 2

      - name: Run isolated Godot lock test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint /bin/bash barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd -c 'set -e; apt-get update; apt-get install -y --no-install-recommends python3; python3 tests/native/save_lock_lab/check_godot.py "$(command -v godot)"'
      - name: Install pinned Godot console build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/godotengine/godot/releases/tags/4.7.2-stable"
          $asset = $release.assets | Where-Object { $_.name -eq "Godot_v4.7.2-stable_win64.exe.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Official Godot 4.7.2 Windows console asset not found." }
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $expected = "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Godot archive SHA-256 mismatch: $actual" }
          $install = Join-Path $env:RUNNER_TEMP "godot"
          Expand-Archive -Path $zip -DestinationPath $install -Force
          $exe = Get-ChildItem -Path $install -Filter "*console.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable was not extracted." }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run isolated Godot lock test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/native/save_lock_lab/check_godot.py "$env:GODOT_EXE"
          if ($LASTEXITCODE -ne 0) { throw "Godot interprocess lock test failed" }
