name: Godot canonical save state tests

on:
  pull_request:
    paths:
      - 'scripts/core/save_manager.gd'
      - 'tests/godot/test_save_canonical_headless.gd'
      - 'tests/godot/test_save_transaction_preview_headless.gd'
      - '.github/workflows/godot-save-canonical.yml'
      - 'tests/python/save_lock_lab.py'
      - 'tests/python/test_save_lock_lab.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run canonical state contract
        shell: bash
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          export XDG_DATA_HOME="$sandbox"
          export LITD_SAVE_TEST_SANDBOX="$sandbox"
          bash tools/ci/run_godot_checked.sh --log "$sandbox/import.log" -- godot --headless --path . --import --quit
          bash tools/ci/run_godot_checked.sh --log "$sandbox/canonical.log" --expect SAVE_CANONICAL_CONTRACT_PASS -- godot --headless --path . --script res://tests/godot/test_save_canonical_headless.gd
          bash tools/ci/run_godot_checked.sh --log "$sandbox/transaction.log" --expect SAVE_TRANSACTION_PREVIEW_PASS -- godot --headless --path . --script res://tests/godot/test_save_transaction_preview_headless.gd
  windows-save-recovery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Godot console build
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/godotengine/godot/releases/tags/4.7.2-stable"
          $asset = $release.assets | Where-Object { $_.name -eq "Godot_v4.7.2-stable_win64.exe.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Official Godot 4.7.2 Windows console asset not found." }
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $expected = "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Godot archive SHA-256 mismatch: $actual" }
          $install = Join-Path $env:RUNNER_TEMP "godot"
          Expand-Archive -Path $zip -DestinationPath $install -Force
          $exe = Get-ChildItem -Path $install -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable was not extracted." }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import and exercise recovery using an isolated Windows profile
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP ("litd-save-sandbox-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          $env:APPDATA = $sandbox
          $env:LOCALAPPDATA = $sandbox
          $env:XDG_DATA_HOME = $sandbox
          $env:LITD_SAVE_TEST_SANDBOX = $sandbox
          & $env:GODOT_EXE --headless --path . --import --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows import failed: $LASTEXITCODE" }
          & $env:GODOT_EXE --headless --path . --script res://tests/godot/test_save_canonical_headless.gd
          if ($LASTEXITCODE -ne 0) { throw "Windows canonical save test failed: $LASTEXITCODE" }
          & $env:GODOT_EXE --headless --path . --script res://tests/godot/test_save_transaction_preview_headless.gd
          if ($LASTEXITCODE -ne 0) { throw "Windows interrupted-write/recovery matrix failed: $LASTEXITCODE" }

  native-lock-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Verify native lock contention and forced termination
        run: python -m pytest -v tests/python/test_save_lock_lab.py
