name: LITD Windows playtest build
on:
  pull_request:
    paths:
      - 'scripts/ui/playtest_gallery.gd'
      - 'scripts/ui/game_hub.gd'
      - 'scenes/tests/playtest_gallery.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/litd-windows-playtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export Windows debug build
        shell: bash
        run: |
          set -euo pipefail
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          export XDG_DATA_HOME="$sandbox"
          mkdir -p build/windows
          bash tools/ci/run_godot_checked.sh --log "$sandbox/import.log" -- godot --headless --path . --import --quit
          # The CI image may keep templates outside the isolated XDG_DATA_HOME.
          # Locate an existing matching template rather than downloading an unverified binary.
          template_dir="$sandbox/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          candidate=$(find /root /opt /usr/local -type f -name windows_debug_x86_64.exe -path '*/4.7.2.stable/*' -print -quit 2>/dev/null || true)
          if [ -z "$candidate" ]; then
            echo "MISSING_GODOT_4_7_2_WINDOWS_EXPORT_TEMPLATES"
            exit 1
          fi
          cp "$(dirname "$candidate")"/windows_debug_x86_64.exe "$template_dir/"
          cp "$(dirname "$candidate")"/windows_release_x86_64.exe "$template_dir/"
          bash tools/ci/run_godot_checked.sh --log "$sandbox/export.log" -- godot --headless --path . --export-debug "Windows Desktop" build/windows/LightInTheDark.exe
          test -s build/windows/LightInTheDark.exe
          test -s build/windows/LightInTheDark.pck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LITD1-Windows-Playtest
          path: |
            build/windows/LightInTheDark.exe
            build/windows/LightInTheDark.pck
          if-no-files-found: error
          retention-days: 7
