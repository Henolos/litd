name: Application Decision Gate Contract

on:
  pull_request:
    paths:
      - 'tools/quality/application_decision_gate.py'
      - 'tools/quality/guardian_authority_contract.py'
      - 'tests/python/test_application_decision_gate.py'
      - '.github/workflows/application-decision-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run application decision gate tests
        run: python -m pytest -q tests/python/test_application_decision_gate.py
      - name: Verify canonical authority binding and closure requirements
        run: |
          grep -q 'APPLICATION_AUTHORIZED_PENDING_SEPARATE_MERGE' tools/quality/application_decision_gate.py
          grep -q 'assert_authority_equivalent' tools/quality/application_decision_gate.py
          grep -q 'CANONICAL_AUTHORITY' tools/quality/application_decision_gate.py
          grep -q 'post_merge_measurement_required' tools/quality/application_decision_gate.py
          grep -q 'provenance_checkpoint_required' tools/quality/application_decision_gate.py
