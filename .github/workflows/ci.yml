name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances QA
        run: python -m pip install -r requirements-dev.txt
      - name: Préparer les rapports QA
        run: mkdir -p reports
      - name: Pilote des déclarations de preuves de la PR (non bloquant)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: python tools/qa/validate_pr_evidence.py --event "$GITHUB_EVENT_PATH"
      - name: Tests Python rapides
        run: python -m pytest -q --tb=short --junitxml=reports/pytest.xml
      - name: Conserver le résultat de tous les tests Python
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-test-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  quality-full:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate reconstruction boundaries and preserved references
        run: python tools/qa/reconstruction_audit.py

  godot-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Validates retained storage and technical services; no gameplay remains.
      - name: Compilation stricte et parcours critique Godot
        run: bash tools/build/run_godot_ci.sh
