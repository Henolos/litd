name: Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - 'tools/ci/canon_freshness_gate.py'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - 'tools/ci/canon_freshness_gate.py'

concurrency:
  group: builds-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  canon-freshness:
    if: ${{ github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    name: Canon Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reject stale runtime canon
        run: python tools/ci/canon_freshness_gate.py

  select-exports:
    name: Select export scope
    needs: canon-freshness
    runs-on: ubuntu-latest
    outputs:
      build_all: ${{ steps.scope.outputs.build_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Decide when platform exports are necessary
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Exports always available on main, release tags and manual runs.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Missing commit or unknown diff must fail closed.
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/litd-export-changes.txt; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(project\.godot|export_presets\.cfg|\.github/workflows/build\.yml)$' /tmp/litd-export-changes.txt; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi

  export:
    if: ${{ (github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/')) && needs.select-exports.outputs.build_all == 'true' }}
    needs: [canon-freshness, select-exports]
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Web
            artifact: light-in-the-dark-web
            path: build/web
          - preset: Windows Desktop
            artifact: light-in-the-dark-windows
            path: build/windows
          - preset: Linux/X11
            artifact: light-in-the-dark-linux
            path: build/linux
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: mkdir -p "${{ matrix.path }}"
      - run: godot --headless --path . --export-release "${{ matrix.preset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
