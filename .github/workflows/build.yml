name: Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'art/**'
      - 'data/**'
      - 'tools/ci/canon_freshness_gate.py'
      - 'tools/ci/select_export_targets.py'
      - 'tools/ci/test_pwa_cache_update.cjs'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'art/**'
      - 'data/**'
      - 'tools/ci/canon_freshness_gate.py'
      - 'tools/ci/select_export_targets.py'
      - 'tools/ci/test_pwa_cache_update.cjs'

concurrency:
  group: builds-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  canon-freshness:
    if: ${{ github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    name: Canon Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Reject stale runtime canon
        run: python tools/ci/canon_freshness_gate.py

  select-exports:
    name: Select export platforms
    needs: canon-freshness
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
      build_any: ${{ steps.choose.outputs.build_any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Choose conservative export matrix
        id: choose
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] &&
               git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
               git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null &&
               git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/export-changes.txt; then
              python3 tools/ci/select_export_targets.py --files-from /tmp/export-changes.txt --github-output "$GITHUB_OUTPUT"
            else
              # Fail closed: unknown diff means full platform validation.
              python3 tools/ci/select_export_targets.py --all --github-output "$GITHUB_OUTPUT"
            fi
          else
            python3 tools/ci/select_export_targets.py --all --github-output "$GITHUB_OUTPUT"
          fi

  export:
    if: ${{ (github.actor != 'dependabot[bot]' || !startsWith(github.head_ref, 'dependabot/github_actions/')) && needs.select-exports.outputs.build_any == 'true' }}
    needs: [canon-freshness, select-exports]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-exports.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: mkdir -p "${{ matrix.path }}"
      - run: godot --headless --path . --export-release "${{ matrix.preset }}"
      - name: Verify official textures in exported Web pack
        if: ${{ matrix.preset == 'Web' }}
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --main-pack build/web/index.pck \
            --script res://scripts/tests/hero_art_export_check.gd 2>&1 | tee /tmp/hero-art-export.log
          grep -q 'EXPORTED_HERO_ART_OK' /tmp/hero-art-export.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Parse Error' /tmp/hero-art-export.log; then
            exit 1
          fi
          test -s build/web/index.service.worker.js
          grep -q 'index.pck' build/web/index.service.worker.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error


  pwa-baseline:
    name: Export PWA baseline
    needs: [canon-freshness, select-exports]
    if: ${{ github.event_name == 'pull_request' && needs.select-exports.outputs.build_any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    env:
      XDG_DATA_HOME: /root/.local/share
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Export the previous version without altering its worker
        run: |
          mkdir -p build/pwa-baseline
          godot --headless --path . --export-release Web build/pwa-baseline/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pwa-baseline-web
          path: build/pwa-baseline
          if-no-files-found: error
          retention-days: 7

  pwa-cache-update:
    name: PWA cache update (Chromium)
    needs: [export, pwa-baseline]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: pwa-baseline-web
          path: ${{ runner.temp }}/pwa-baseline
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: light-in-the-dark-web
          path: ${{ runner.temp }}/pwa-candidate
      - name: Install the pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-tools" --no-save --ignore-scripts playwright@1.65.0
          "$RUNNER_TEMP/pwa-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check old cache then normal activation of the new export
        env:
          PWA_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
          PWA_CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          export PWA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pwa-tools/node_modules/playwright"
          node tools/ci/test_pwa_cache_update.cjs \
            "$RUNNER_TEMP/pwa-baseline" "$RUNNER_TEMP/pwa-candidate" \
            reports/pwa-cache-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: pwa-cache-update-evidence
          path: reports/pwa-cache-update
          if-no-files-found: warn
          retention-days: 7
