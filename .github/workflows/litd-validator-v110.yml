name: LITD validator V1.10

on:
  pull_request:
    branches:
      - feat/litd-exploration-validator-v18
    paths:
      - 'tools/qa/litd_exploration_validator/v1_10/**'
      - '.github/workflows/litd-validator-v110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install -r requirements.txt
        working-directory: tools/qa/litd_exploration_validator/v1_10
      - name: Verify jsonschema version
        run: python -c "from importlib.metadata import version; assert version('jsonschema') == '4.26.0', version('jsonschema')"
      - name: Run all validator tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: tools/qa/litd_exploration_validator/v1_10
