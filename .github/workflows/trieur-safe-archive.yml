name: Trieur Safe Archive

on:
  pull_request:
    paths:
      - 'governance/trieur_policy.json'
      - 'tools/ci/trieur_safe_archive.py'
      - 'archive/**'
      - 'data/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/trieur-safe-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-dry-run:
    name: Trieur Archive Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate archive plan without changing files
        run: python tools/ci/trieur_safe_archive.py
