name: Trieur Safe Archive

on:
  pull_request:
    paths:
      - 'governance/trieur_policy.json'
      - 'tools/ci/trieur_safe_archive.py'
      - 'archive/**'
      - 'data/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/trieur-safe-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-dry-run:
    name: Trieur Archive Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 
        with:
          python-version: '3.12'
      - name: Validate archive plan without changing files
        run: python tools/ci/trieur_safe_archive.py
